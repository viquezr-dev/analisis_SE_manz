<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Estudio Socioeconómico - Manzanas 2023</title>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    
    <!-- Turf.js -->
    <script src="https://unpkg.com/@turf/turf/turf.min.js"></script>
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f0f2f5; }
        #map { height: 100vh; width: 100%; }

        .control-panel {
            position: absolute;
            top: 10px;
            right: 10px;
            z-index: 1000;
            background: rgba(255,255,255,0.95);
            padding: 10px 12px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            max-width: 270px;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255,255,255,0.3);
            max-height: 95vh;
            overflow-y: auto;
            font-size: 11px;
        }
        .control-panel h3 { font-size: 13px; color: #1a2a3a; border-bottom: 2px solid #d94f4f; padding-bottom: 4px; margin-bottom: 6px; }
        .control-panel label { font-weight: 600; font-size: 10px; color: #2c3e50; display: block; margin-top: 5px; margin-bottom: 2px; }
        .control-panel select { width: 100%; padding: 3px 6px; border-radius: 5px; border: 1px solid #ccc; background: white; font-size: 10px; cursor: pointer; }
        .control-panel select:focus { outline: none; border-color: #d94f4f; box-shadow: 0 0 0 2px rgba(217,79,79,0.2); }

        .mode-toggle { display: flex; gap: 4px; margin-top: 5px; }
        .mode-toggle button { flex: 1; padding: 4px 6px; border: 1px solid #d94f4f; background: white; color: #d94f4f; border-radius: 5px; font-size: 10px; font-weight: 600; cursor: pointer; transition: all 0.2s; }
        .mode-toggle button.active { background: #d94f4f; color: white; }

        .search-container { margin-top: 5px; display: flex; gap: 4px; }
        .search-container input { flex: 1; padding: 3px 6px; border-radius: 5px; border: 1px solid #ccc; font-size: 10px; outline: none; }
        .search-container input:focus { border-color: #d94f4f; box-shadow: 0 0 0 2px rgba(217,79,79,0.2); }
        .search-container button { padding: 3px 8px; border-radius: 5px; border: none; background: #d94f4f; color: white; font-size: 10px; cursor: pointer; }
        .search-container button:hover { background: #b33a3a; }

        .action-buttons { display: flex; gap: 4px; margin-top: 5px; }
        .action-buttons button { flex: 1; padding: 3px 6px; border-radius: 5px; border: none; font-size: 9px; cursor: pointer; font-weight: 600; transition: background 0.2s; }
        .btn-export { background: #2a8b5e; color: white; }
        .btn-export:hover { background: #1e6b47; }
        .btn-stats { background: #2c6b9e; color: white; }
        .btn-stats:hover { background: #1e4f7a; }
        .btn-reset { background: #fee2e2; color: #991b1b; }
        .btn-reset:hover { background: #fca5a5; }

        .filtros-container { margin-top: 5px; padding: 5px 7px; background: #f8f9fa; border-radius: 5px; border-left: 3px solid #d94f4f; max-height: 160px; overflow-y: auto; }
        .filtros-container h4 { font-size: 10px; color: #1a2a3a; margin-bottom: 3px; }
        .filtro-checkbox { display: flex; align-items: center; margin: 2px 0; font-size: 10px; color: #2c3e50; cursor: pointer; padding: 1px 4px; border-radius: 3px; }
        .filtro-checkbox:hover { background: #e9ecef; }
        .filtro-checkbox input[type="checkbox"] { margin-right: 5px; width: 12px; height: 12px; accent-color: #d94f4f; flex-shrink: 0; }
        .filtro-checkbox .color-muestra { width: 14px; height: 10px; border-radius: 2px; margin-right: 5px; border: 1px solid rgba(0,0,0,0.1); flex-shrink: 0; }
        .filtro-checkbox .count-badge { margin-left: auto; font-size: 8px; background: #e9ecef; padding: 0 5px; border-radius: 8px; color: #555; }
        .select-all-container { display: flex; gap: 4px; margin-bottom: 3px; }
        .select-all-container button { font-size: 9px; padding: 1px 6px; border: 1px solid #ccc; border-radius: 3px; background: white; cursor: pointer; }
        .select-all-container button:hover { background: #e9ecef; }
        .btn-reset-filtros { background: #d94f4f; color: white; border: none; padding: 2px 8px; border-radius: 4px; font-size: 9px; cursor: pointer; margin-top: 3px; width: 100%; font-weight: 600; }
        .btn-reset-filtros:hover { background: #b33a3a; }

        .info-box { margin-top: 5px; font-size: 10px; color: #34495e; background: #f8f9fa; padding: 5px 7px; border-radius: 5px; border-left: 3px solid #d94f4f; line-height: 1.4; }
        .info-box strong { color: #1a2a3a; }
        .info-box .valor { font-weight: 700; color: #d94f4f; }
        .info-box .stats { font-size: 9px; color: #666; margin-top: 2px; border-top: 1px dashed #ddd; padding-top: 2px; }

        .legend { margin-top: 5px; padding: 5px 7px; background: #f8f9fa; border-radius: 5px; font-size: 9px; }
        .legend-title { font-weight: 600; color: #2c3e50; margin-bottom: 3px; font-size: 10px; }
        .legend-item { display: flex; align-items: center; margin: 2px 0; }
        .legend-color { width: 14px; height: 10px; border-radius: 2px; margin-right: 5px; border: 1px solid rgba(0,0,0,0.1); flex-shrink: 0; }
        .legend-text { font-size: 9px; color: #2c3e50; }
        .gradient-bar { height: 10px; width: 100%; border-radius: 4px; background: linear-gradient(to right, blue, cyan, lime, yellow, red); margin-top: 4px; }
        .gradient-labels { display: flex; justify-content: space-between; font-size: 9px; color: #555; }
        .legend-desc { font-size: 8px; color: #888; margin-top: 3px; padding-top: 3px; border-top: 1px dashed #ddd; font-style: italic; }

        .modal-overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.6); z-index: 2000; justify-content: center; align-items: center; backdrop-filter: blur(2px); }
        .modal-overlay.active { display: flex; }
        .modal-content { background: white; padding: 20px; border-radius: 12px; max-width: 600px; width: 90%; max-height: 80vh; overflow-y: auto; box-shadow: 0 8px 30px rgba(0,0,0,0.3); position: relative; }
        .modal-content h3 { font-size: 16px; color: #1a2a3a; margin-bottom: 12px; border-bottom: 2px solid #d94f4f; padding-bottom: 6px; }
        .modal-close { position: absolute; top: 10px; right: 15px; font-size: 22px; cursor: pointer; color: #888; background: none; border: none; }
        .modal-close:hover { color: #d94f4f; }
        .modal-content canvas { max-height: 300px; max-width: 100%; }
        .modal-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 12px; font-size: 11px; }
        .modal-stats .stat-item { background: #f8f9fa; padding: 6px 10px; border-radius: 5px; text-align: center; }
        .modal-stats .stat-item .num { font-weight: 700; color: #d94f4f; font-size: 14px; }
        .modal-stats .stat-item .label { color: #666; font-size: 9px; }

        .heatmap-controls { display: none; margin-top: 5px; padding-top: 5px; border-top: 1px dashed #ccc; }
        .heatmap-controls label { font-size: 9px; }
        .heatmap-controls input[type="range"] { width: 100%; accent-color: #d94f4f; }

        .footer { position: absolute; bottom: 6px; left: 50%; transform: translateX(-50%); z-index: 1000; background: rgba(0,0,0,0.7); color: white; padding: 3px 12px; border-radius: 14px; font-size: 9px; backdrop-filter: blur(2px); pointer-events: none; white-space: nowrap; }

        @media (max-width: 600px) {
            .control-panel { top: 6px; right: 6px; max-width: 200px; padding: 6px 8px; }
            .control-panel h3 { font-size: 11px; }
            .control-panel select { font-size: 9px; padding: 2px 5px; }
            .filtros-container { max-height: 120px; padding: 4px 5px; }
            .filtro-checkbox { font-size: 9px; }
            .legend { font-size: 8px; padding: 4px 5px; }
            .info-box { font-size: 9px; padding: 4px 5px; }
            .footer { font-size: 7px; padding: 2px 8px; }
        }
    </style>
</head>
<body>

    <div id="map"></div>

    <div class="modal-overlay" id="statsModal">
        <div class="modal-content">
            <button class="modal-close" onclick="closeStats()">&times;</button>
            <h3 id="statsTitle">📊 Estadísticas del indicador</h3>
            <canvas id="statsChart"></canvas>
            <div class="modal-stats" id="statsNumbers"></div>
        </div>
    </div>

    <div class="control-panel">
        <h3>📊 Manzanas - Análisis SE</h3>

        <label for="map-select">🗺️ Mapa base:</label>
        <select id="map-select">
            <option value="satellite">🛰️ Satélite</option>
            <option value="osm">🌍 OpenStreetMap</option>
            <option value="topo">🗺️ Topográfico</option>
        </select>

        <label>📈 Modo:</label>
        <div class="mode-toggle">
            <button id="btn-polygon" class="active">🗺️ Polígonos</button>
            <button id="btn-heatmap">🔥 Calor</button>
        </div>

        <label for="variable-select">📈 Indicador:</label>
        <select id="variable-select">
            <option value="CAT_DENS" selected>🏷️ Categoría de densidad</option>
            <option value="DENS_POB">👥 Densidad poblacional</option>
            <option value="VIV_OCUP">🏠 Viviendas ocupadas</option>
            <option value="PORC_OCU">📊 % Ocupación</option>
            <option value="PERS_VIV">👤 Pers./viv.</option>
        </select>

        <div class="search-container">
            <input type="text" id="searchInput" placeholder="🔍 Buscar manzana, barrio o lugar..." />
            <button onclick="buscarManzana()">Buscar</button>
        </div>

        <div class="action-buttons">
            <button class="btn-stats" onclick="mostrarEstadisticas()">📊 Estadísticas</button>
            <button class="btn-export" onclick="exportarCSV()">💾 Exportar CSV</button>
            <button class="btn-reset" onclick="resetFiltros()">🔄 Resetear</button>
        </div>

        <div id="heatmap-controls" class="heatmap-controls">
            <label>Radio: <span id="radius-val">10</span>px</label>
            <input type="range" id="radius-slider" min="4" max="30" value="10">
            <label>Difuminado: <span id="blur-val">5</span>px</label>
            <input type="range" id="blur-slider" min="2" max="20" value="5">
        </div>

        <div id="filtros-container" class="filtros-container">
            <!-- Se llena con JS -->
        </div>

        <div class="info-box" id="info-box">
            <strong id="info-label">Categoría de densidad</strong><br />
            <span id="info-value">Selecciona una manzana</span>
            <div class="stats" id="stats-info">Mostrando: <span id="count-mostrados">0</span> de <span id="count-total">0</span></div>
        </div>

        <div id="legend" class="legend">
            <!-- Se llena con JS -->
        </div>
    </div>

    <div class="footer">Datos: Estudio Socioeconómico 2023 – RAUL VIQUEZ</div>

    <!-- ================================================================ -->
    <!-- LIBRERÍAS EN ORDEN CORRECTO -->
    <!-- ================================================================ -->
    <!-- 1. Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <!-- 2. heatmap.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/heatmap.js/2.0.5/heatmap.min.js"></script>
    
    <!-- 3. leaflet-heatmap - VERSIÓN QUE FUNCIONA -->
    <script src="https://cdn.jsdelivr.net/npm/leaflet-heatmap@1.0.0/leaflet-heatmap.min.js"></script>
    
    <script>
        // ================================================================
        // 1. MAPA Y CAPAS BASE
        // ================================================================
        const map = L.map('map', { center: [8.0, -80.0], zoom: 7 });

        const satelliteLayer = L.tileLayer(
            'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
                attribution: 'Tiles &copy; Esri',
                maxZoom: 19
            }
        );

        const osmLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap contributors',
            maxZoom: 19
        });

        const topoLayer = L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenTopoMap',
            maxZoom: 17
        });

        satelliteLayer.addTo(map);

        // ================================================================
        // 2. VARIABLES GLOBALES
        // ================================================================
        let currentLayer = null;
        let currentVariable = 'CAT_DENS';
        let geoJsonData = null;
        let allFeatures = [];
        let filtrosActivos = {};
        let chartInstance = null;
        let currentFeaturesFiltradas = [];
        let currentMode = 'polygon';
        let heatmapLayer = null;
        let heatmapPoints = [];

        // ================================================================
        // 3. PALETAS DE COLORES Y FUNCIONES DE RANGOS
        // ================================================================
        const catColors = {
            'MUY_BAJA': '#fcbba1',
            'BAJA': '#fc9272',
            'MEDIA': '#fb6a4a',
            'ALTA': '#de2d26',
            'MUY_ALTA': '#a50f15',
            'SIN_DATOS': '#b0b0b0'
        };

        const catLabels = {
            'MUY_BAJA': 'Muy baja (<100 hab/km²)',
            'BAJA': 'Baja (100-500)',
            'MEDIA': 'Media (500-1500)',
            'ALTA': 'Alta (1500-5000)',
            'MUY_ALTA': 'Muy alta (>5000)',
            'SIN_DATOS': 'Sin datos'
        };

        const variableLabels = {
            'CAT_DENS': 'Categoría de densidad',
            'DENS_POB': 'Densidad poblacional (hab/km²)',
            'VIV_OCUP': 'Viviendas ocupadas',
            'PORC_OCU': '% Ocupación',
            'PERS_VIV': 'Personas por vivienda'
        };

        const descripcionIndicador = {
            'CAT_DENS': 'Clasificación según densidad poblacional.',
            'DENS_POB': 'Habitantes por kilómetro cuadrado.',
            'VIV_OCUP': 'Viviendas actualmente habitadas.',
            'PORC_OCU': 'Porcentaje de viviendas ocupadas.',
            'PERS_VIV': 'Promedio de personas por vivienda.'
        };

        let vivOcupCache = null;
        
        function getVivOcupRangos(features) {
            if (vivOcupCache) return vivOcupCache;
            
            const valores = features
                .map(f => parseFloat(f.properties['VIV_OCUP']))
                .filter(v => !isNaN(v) && v !== null && v > 0)
                .sort((a, b) => a - b);
            
            if (valores.length === 0) {
                vivOcupCache = { p20: 0, p40: 0, p60: 0, p80: 0, valores: [] };
                return vivOcupCache;
            }
            
            const total = valores.length;
            const p20 = valores[Math.floor(total * 0.20)];
            const p40 = valores[Math.floor(total * 0.40)];
            const p60 = valores[Math.floor(total * 0.60)];
            const p80 = valores[Math.floor(total * 0.80)];
            
            vivOcupCache = { p20, p40, p60, p80, valores };
            return vivOcupCache;
        }
        
        function getRangoIndexVivOup(valor, features) {
            if (isNaN(valor) || valor === null || valor === 0) return 0;
            
            const rangos = getVivOcupRangos(features);
            if (rangos.valores.length === 0) return 0;
            
            const { p20, p40, p60, p80 } = rangos;
            
            if (valor <= p20) return 0;
            if (valor <= p40) return 1;
            if (valor <= p60) return 2;
            if (valor <= p80) return 3;
            return 4;
        }
        
        function getColorVivOcup(valor, features) {
            if (isNaN(valor) || valor === null || valor === 0) return '#cccccc';
            
            const rangos = getVivOcupRangos(features);
            if (rangos.valores.length === 0) return '#cccccc';
            
            const { p20, p40, p60, p80 } = rangos;
            const colores = ['#e5f5e0', '#a1d99b', '#74c476', '#41ab5d', '#006d2c'];
            
            if (valor <= p20) return colores[0];
            if (valor <= p40) return colores[1];
            if (valor <= p60) return colores[2];
            if (valor <= p80) return colores[3];
            return colores[4];
        }
        
        function obtenerNombresRangosVivOcup(features) {
            const rangos = getVivOcupRangos(features);
            if (rangos.valores.length === 0) {
                return ['Muy bajo', 'Bajo', 'Medio', 'Alto', 'Muy alto'];
            }
            
            const { p20, p40, p60, p80 } = rangos;
            
            return [
                `Muy bajo (0-${Math.round(p20)})`,
                `Bajo (${Math.round(p20)}-${Math.round(p40)})`,
                `Medio (${Math.round(p40)}-${Math.round(p60)})`,
                `Alto (${Math.round(p60)}-${Math.round(p80)})`,
                `Muy alto (>${Math.round(p80)})`
            ];
        }

        function getRangoIndex(variable, value) {
            if (isNaN(value) || value === null || value === 0) return 0;
            
            if (variable === 'DENS_POB') {
                if (value < 100) return 0;
                if (value < 500) return 1;
                if (value < 1500) return 2;
                if (value < 5000) return 3;
                return 4;
            }
            
            if (variable === 'VIV_OCUP') {
                return getRangoIndexVivOup(value, allFeatures);
            }
            
            if (variable === 'PORC_OCU') {
                if (value < 20) return 0;
                if (value < 40) return 1;
                if (value < 60) return 2;
                if (value < 80) return 3;
                return 4;
            }
            
            if (variable === 'PERS_VIV') {
                if (value < 1.2) return 0;
                if (value < 2.4) return 1;
                if (value < 3.6) return 2;
                if (value < 4.8) return 3;
                return 4;
            }
            
            return 0;
        }

        function getColorByValue(variable, value) {
            if (isNaN(value) || value === null || value === 0) return '#cccccc';
            
            if (variable === 'CAT_DENS') {
                return catColors[value] || '#cccccc';
            }
            
            if (variable === 'DENS_POB') {
                if (value < 100) return '#fcbba1';
                if (value < 500) return '#fc9272';
                if (value < 1500) return '#fb6a4a';
                if (value < 5000) return '#de2d26';
                return '#a50f15';
            }
            
            if (variable === 'VIV_OCUP') {
                return getColorVivOcup(value, allFeatures);
            }
            
            if (variable === 'PORC_OCU') {
                if (value < 20) return '#fdd0a2';
                if (value < 40) return '#fdae6b';
                if (value < 60) return '#f16913';
                if (value < 80) return '#d94801';
                return '#8c2d04';
            }
            
            if (variable === 'PERS_VIV') {
                if (value < 1.2) return '#bcbddc';
                if (value < 2.4) return '#9e9ac8';
                if (value < 3.6) return '#807dba';
                if (value < 4.8) return '#6a51a3';
                return '#4a1486';
            }
            
            return '#cccccc';
        }

        function obtenerNombresRangos(variable) {
            if (variable === 'DENS_POB') {
                return ['Muy baja (<100)', 'Baja (100-500)', 'Media (500-1500)', 'Alta (1500-5000)', 'Muy alta (>5000)'];
            }
            if (variable === 'VIV_OCUP') {
                return obtenerNombresRangosVivOcup(allFeatures);
            }
            if (variable === 'PORC_OCU') {
                return ['Muy bajo (0-20%)', 'Bajo (20-40%)', 'Medio (40-60%)', 'Alto (60-80%)', 'Muy alto (80-100%)'];
            }
            if (variable === 'PERS_VIV') {
                return ['Muy bajo (0.0-1.2)', 'Bajo (1.2-2.4)', 'Medio (2.4-3.6)', 'Alto (3.6-4.8)', 'Muy alto (4.8-6.0)'];
            }
            return ['Muy bajo', 'Bajo', 'Medio', 'Alto', 'Muy alto'];
        }

        function getColoresRangos(variable) {
            if (variable === 'DENS_POB') {
                return ['#fcbba1', '#fc9272', '#fb6a4a', '#de2d26', '#a50f15'];
            }
            if (variable === 'VIV_OCUP') {
                return ['#e5f5e0', '#a1d99b', '#74c476', '#41ab5d', '#006d2c'];
            }
            if (variable === 'PORC_OCU') {
                return ['#fdd0a2', '#fdae6b', '#f16913', '#d94801', '#8c2d04'];
            }
            if (variable === 'PERS_VIV') {
                return ['#bcbddc', '#9e9ac8', '#807dba', '#6a51a3', '#4a1486'];
            }
            return ['#a1d99b', '#74c476', '#41ab5d', '#238b45', '#005a32'];
        }

        // ================================================================
        // 4. FILTROS
        // ================================================================
        function getFiltros() {
            const checkboxes = document.querySelectorAll('.filtro-checkbox input[type="checkbox"]');
            const activos = {};
            checkboxes.forEach(cb => { activos[cb.value] = cb.checked; });
            return activos;
        }

        function aplicarFiltros(features, variable) {
            const activos = getFiltros();
            const algunActivo = Object.values(activos).some(v => v === true);
            if (!algunActivo) return [];

            return features.filter(f => {
                let key;
                if (variable === 'CAT_DENS') {
                    key = f.properties[variable] || 'SIN_DATOS';
                    return activos[key] !== false;
                } else {
                    const val = parseFloat(f.properties[variable]);
                    if (isNaN(val) || val === null) return false;
                    const index = getRangoIndex(variable, val);
                    key = `rango_${index}`;
                    return activos[key] !== false;
                }
            });
        }

        // ================================================================
        // 5. CONSTRUIR FILTROS
        // ================================================================
        function construirFiltros(variable) {
            const container = document.getElementById('filtros-container');
            let html = '';
            
            if (variable === 'CAT_DENS') {
                const items = ['MUY_BAJA', 'BAJA', 'MEDIA', 'ALTA', 'MUY_ALTA', 'SIN_DATOS'];
                html = `<h4>🔍 Filtrar por categoría:</h4>
                    <div class="select-all-container">
                        <button onclick="toggleAllFiltros(true)">✅ Todo</button>
                        <button onclick="toggleAllFiltros(false)">❌ Nada</button>
                    </div>`;
                for (const key of items) {
                    const checked = filtrosActivos[key] !== false;
                    html += `<label class="filtro-checkbox">
                        <input type="checkbox" value="${key}" ${checked ? 'checked' : ''} />
                        <span class="color-muestra" style="background:${catColors[key]};"></span>
                        <span>${catLabels[key]}</span>
                        <span class="count-badge" id="count-${key}">0</span>
                    </label>`;
                }
            } else {
                const nombresRangos = obtenerNombresRangos(variable);
                const colores = getColoresRangos(variable);
                html = `<h4>🔍 Filtrar por rango:</h4>
                    <div class="select-all-container">
                        <button onclick="toggleAllFiltros(true)">✅ Todo</button>
                        <button onclick="toggleAllFiltros(false)">❌ Nada</button>
                    </div>`;
                for (let i = 0; i < nombresRangos.length; i++) {
                    const key = `rango_${i}`;
                    const checked = filtrosActivos[key] !== false;
                    const color = colores[i] || '#cccccc';
                    html += `<label class="filtro-checkbox">
                        <input type="checkbox" value="${key}" ${checked ? 'checked' : ''} />
                        <span class="color-muestra" style="background:${color};"></span>
                        <span>${nombresRangos[i]}</span>
                        <span class="count-badge" id="count-${key}">0</span>
                    </label>`;
                }
            }
            
            html += `<button class="btn-reset-filtros" onclick="resetFiltros()">🔄 Restablecer filtros</button>`;
            container.innerHTML = html;
            
            document.querySelectorAll('.filtro-checkbox input[type="checkbox"]').forEach(cb => {
                cb.addEventListener('change', function() {
                    filtrosActivos[this.value] = this.checked;
                    updateMap();
                });
            });
            
            actualizarContadores();
        }

        function actualizarContadores() {
            const variable = currentVariable;
            
            if (variable === 'CAT_DENS') {
                const categories = ['MUY_BAJA', 'BAJA', 'MEDIA', 'ALTA', 'MUY_ALTA', 'SIN_DATOS'];
                for (const cat of categories) {
                    const count = allFeatures.filter(f => (f.properties['CAT_DENS'] || 'SIN_DATOS') === cat).length;
                    const el = document.getElementById(`count-${cat}`);
                    if (el) el.textContent = count;
                }
            } else {
                const nombresRangos = obtenerNombresRangos(variable);
                for (let i = 0; i < nombresRangos.length; i++) {
                    const key = `rango_${i}`;
                    const count = allFeatures.filter(f => {
                        const val = parseFloat(f.properties[variable]);
                        if (isNaN(val) || val === null) return false;
                        const index = getRangoIndex(variable, val);
                        return index === i;
                    }).length;
                    const el = document.getElementById(`count-${key}`);
                    if (el) el.textContent = count;
                }
            }
        }

        function toggleAllFiltros(estado) {
            const checkboxes = document.querySelectorAll('.filtro-checkbox input[type="checkbox"]');
            checkboxes.forEach(cb => {
                cb.checked = estado;
                filtrosActivos[cb.value] = estado;
            });
            updateMap();
        }

        function resetFiltros() {
            const checkboxes = document.querySelectorAll('.filtro-checkbox input[type="checkbox"]');
            checkboxes.forEach(cb => {
                cb.checked = true;
                filtrosActivos[cb.value] = true;
            });
            document.getElementById('searchInput').value = '';
            if (geoJsonData) {
                const bounds = L.geoJSON(geoJsonData).getBounds();
                if (bounds.isValid()) map.fitBounds(bounds, { padding: [20, 20] });
            }
            updateMap();
        }

        // ================================================================
        // 6. BUSCADOR DE MANZANA
        // ================================================================
        function buscarManzana() {
            const texto = document.getElementById('searchInput').value.toLowerCase().trim();
            if (!texto || !geoJsonData) return;

            const encontrados = allFeatures.filter(f => {
                const code = String(f.properties.MANZA_CODE || '').toLowerCase();
                const barrio = String(f.properties.BARR_NOMB || '').toLowerCase();
                const lugar = String(f.properties.LUPO_NOMB || '').toLowerCase();
                return code.includes(texto) || barrio.includes(texto) || lugar.includes(texto);
            });

            if (encontrados.length === 0) {
                alert('No se encontraron resultados para: ' + texto);
                return;
            }

            const geoJsonEncontrados = {
                type: 'FeatureCollection',
                features: encontrados
            };

            if (currentLayer) map.removeLayer(currentLayer);

            currentLayer = L.geoJSON(geoJsonEncontrados, {
                style: function(feature) {
                    let value = feature.properties[currentVariable];
                    let color = '#b0b0b0';
                    if (currentVariable === 'CAT_DENS') {
                        color = catColors[value] || '#b0b0b0';
                    } else {
                        const numVal = parseFloat(value);
                        if (!isNaN(numVal) && numVal !== null) {
                            color = getColorByValue(currentVariable, numVal);
                        }
                    }
                    return { fillColor: color, weight: 2, opacity: 0.9, color: '#000000', fillOpacity: 0.85 };
                },
                onEachFeature: function(feature, layer) {
                    const p = feature.properties;
                    layer.bindPopup(crearPopup(p));
                }
            }).addTo(map);

            const bounds = L.geoJSON(geoJsonEncontrados).getBounds();
            if (bounds.isValid()) map.fitBounds(bounds, { padding: [40, 40] });
            document.getElementById('count-mostrados').textContent = encontrados.length;
            document.getElementById('count-total').textContent = allFeatures.length;
            document.getElementById('info-value').textContent = `🔍 Resultados: ${encontrados.length} manzanas`;
        }

        // ================================================================
        // 8. EXPORTAR CSV
        // ================================================================
        function exportarCSV() {
            if (!geoJsonData || allFeatures.length === 0) {
                alert('No hay datos para exportar');
                return;
            }

            const features = currentFeaturesFiltradas.length > 0 ? currentFeaturesFiltradas : allFeatures;
            const headers = ['MANZA_CODE', 'BARR_NOMB', 'LUPO_NOMB', 'VIVIENDA', 'V_PERSONAS', 'VIV_OCUP', 'PORC_OCU', 'DENS_POB', 'PERS_VIV', 'CAT_DENS', 'AREA_KM2'];

            const rows = features.map(f => {
                const p = f.properties;
                return [
                    p.MANZA_CODE || '',
                    p.BARR_NOMB || '',
                    p.LUPO_NOMB || '',
                    p.VIVIENDA || 0,
                    p.V_PERSONAS || 0,
                    p.VIV_OCUP || 0,
                    p.PORC_OCU ? p.PORC_OCU.toFixed(1) : 0,
                    p.DENS_POB ? p.DENS_POB.toFixed(1) : 0,
                    p.PERS_VIV ? p.PERS_VIV.toFixed(2) : 0,
                    p.CAT_DENS || '',
                    ((p.AREA || 0) / 1000000).toFixed(4)
                ];
            });

            let csv = headers.join(',') + '\n';
            rows.forEach(row => { csv += row.join(',') + '\n'; });

            const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = `manzanas_${currentVariable}.csv`;
            link.click();
            URL.revokeObjectURL(link.href);
        }

        // ================================================================
        // 9. ESTADÍSTICAS
        // ================================================================
        function mostrarEstadisticas() {
            document.getElementById('statsModal').classList.add('active');
            const features = currentFeaturesFiltradas.length > 0 ? currentFeaturesFiltradas : allFeatures;
            const variable = currentVariable;
            document.getElementById('statsTitle').textContent = `📊 Estadísticas: ${variableLabels[variable] || variable}`;

            let labels = [], data = [], colors = [];

            if (variable === 'CAT_DENS') {
                const categories = ['MUY_BAJA', 'BAJA', 'MEDIA', 'ALTA', 'MUY_ALTA', 'SIN_DATOS'];
                const counts = {};
                categories.forEach(c => counts[c] = 0);
                features.forEach(f => {
                    const cat = f.properties[variable] || 'SIN_DATOS';
                    counts[cat] = (counts[cat] || 0) + 1;
                });
                labels = categories.map(c => catLabels[c] || c);
                data = categories.map(c => counts[c] || 0);
                colors = categories.map(c => catColors[c] || '#b0b0b0');
            } else {
                const valores = features.map(f => parseFloat(f.properties[variable])).filter(v => !isNaN(v) && v !== null);
                if (valores.length > 0) {
                    const min = Math.min(...valores), max = Math.max(...valores);
                    const steps = 5, step = (max - min) / steps;
                    const counts = new Array(steps).fill(0);
                    valores.forEach(v => {
                        const idx = Math.min(Math.floor((v - min) / step), steps - 1);
                        counts[idx]++;
                    });
                    labels = counts.map((_, i) => `${(min + i * step).toFixed(1)}-${(min + (i + 1) * step).toFixed(1)}`);
                    data = counts;
                    colors = getColoresRangos(variable);
                }
            }

            const statsDiv = document.getElementById('statsNumbers');
            let statsHTML = '';
            if (variable !== 'CAT_DENS') {
                const valores = features.map(f => parseFloat(f.properties[variable])).filter(v => !isNaN(v) && v !== null);
                if (valores.length > 0) {
                    const sum = valores.reduce((a, b) => a + b, 0);
                    const mean = sum / valores.length;
                    const sorted = [...valores].sort((a, b) => a - b);
                    const median = sorted.length % 2 === 0 ? (sorted[sorted.length / 2 - 1] + sorted[sorted.length / 2]) / 2 :
                        sorted[Math.floor(sorted.length / 2)];
                    statsHTML = `
                        <div class="stat-item"><span class="num">${valores.length}</span><div class="label">Registros</div></div>
                        <div class="stat-item"><span class="num">${mean.toFixed(2)}</span><div class="label">Promedio</div></div>
                        <div class="stat-item"><span class="num">${median.toFixed(2)}</span><div class="label">Mediana</div></div>
                        <div class="stat-item"><span class="num">${sorted[0].toFixed(2)} - ${sorted[sorted.length-1].toFixed(2)}</span><div class="label">Mín - Máx</div></div>
                    `;
                }
            } else {
                const total = data.reduce((a, b) => a + b, 0);
                statsHTML = `
                    <div class="stat-item"><span class="num">${total}</span><div class="label">Total manzanas</div></div>
                    <div class="stat-item"><span class="num">${data.filter(d => d > 0).length}</span><div class="label">Categorías con datos</div></div>
                `;
            }
            statsDiv.innerHTML = statsHTML;

            if (chartInstance) chartInstance.destroy();
            const ctx = document.getElementById('statsChart').getContext('2d');
            chartInstance = new Chart(ctx, {
                type: 'bar',
                data: { labels: labels, datasets: [{ label: 'Manzanas', data: data, backgroundColor: colors, borderWidth: 1 }] },
                options: {
                    responsive: true,
                    plugins: { legend: { display: false } },
                    scales: { y: { beginAtZero: true, ticks: { font: { size: 9 } } },
                        x: { ticks: { font: { size: 8 }, maxRotation: 30 } } }
                }
            });
        }

        // ================================================================
        // 10. CALCULAR PUNTOS PARA HEATMAP
        // ================================================================
        function calcularPuntosHeatmap(features, variable) {
            const puntos = [];

            for (const feature of features) {
                let valor = 1;

                if (variable === 'CAT_DENS') {
                    const catOrder = { 'MUY_BAJA': 1, 'BAJA': 2, 'MEDIA': 3, 'ALTA': 4, 'MUY_ALTA': 5 };
                    valor = catOrder[feature.properties[variable]] || 0;
                    if (valor === 0) continue;
                } else {
                    const val = parseFloat(feature.properties[variable]);
                    if (!Number.isFinite(val) || val <= 0) continue;
                    valor = val;
                }

                try {
                    const centroid = turf.centroid(feature);
                    const coords = centroid.geometry.coordinates;
                    if (coords && coords.length === 2 && Number.isFinite(coords[0]) && Number.isFinite(coords[1])) {
                        puntos.push({ lat: coords[1], lng: coords[0], intensity: valor });
                    }
                } catch (e) {
                    try {
                        const geom = feature.geometry;
                        if (geom && geom.type === 'Polygon') {
                            const coords = geom.coordinates[0];
                            let lat = 0, lng = 0, count = 0;
                            for (const c of coords) {
                                if (Array.isArray(c) && c.length === 2) {
                                    lng += c[0]; lat += c[1]; count++;
                                }
                            }
                            if (count > 0) puntos.push({ lat: lat / count, lng: lng / count, intensity: valor });
                        }
                    } catch (e2) {}
                }
            }

            // Evitar que uno o pocos valores extremos conviertan todo el mapa en una mancha.
            if (puntos.length > 4) {
                const valores = puntos.map(p => p.intensity).sort((a, b) => a - b);
                const percentil = (q) => {
                    const pos = (valores.length - 1) * q;
                    const base = Math.floor(pos);
                    const resto = pos - base;
                    return valores[base + 1] !== undefined
                        ? valores[base] + resto * (valores[base + 1] - valores[base])
                        : valores[base];
                };
                const p05 = percentil(0.05);
                const p95 = percentil(0.95);
                const rango = p95 - p05;

                if (rango > 0) {
                    for (const p of puntos) {
                        const normalizado = Math.max(0, Math.min(1, (p.intensity - p05) / rango));
                        p.intensity = 0.15 + normalizado * 0.85;
                    }
                } else {
                    for (const p of puntos) p.intensity = 0.65;
                }
            } else {
                for (const p of puntos) p.intensity = Math.max(0.15, Math.min(1, p.intensity));
            }

            return puntos;
        }

        // ================================================================
        // 11. FUNCIÓN DE HEATMAP PERSONALIZADA (FALLBACK)
        // ================================================================
        function crearHeatmapFallback(puntos, map, radius, blur) {
            const HeatmapLayer = L.Layer.extend({
                onAdd: function() {
                    const pane = this.getPane();
                    this._canvas = document.createElement('canvas');
                    this._canvas.style.position = 'absolute';
                    this._canvas.style.top = '0';
                    this._canvas.style.left = '0';
                    this._canvas.style.pointerEvents = 'none';
                    this._canvas.style.width = '100%';
                    this._canvas.style.height = '100%';
                    pane.appendChild(this._canvas);
                    this._ctx = this._canvas.getContext('2d');
                    this._reset();
                    this._draw();
                    this._moveHandler = () => { this._reset(); this._draw(); };
                    map.on('move zoom resize', this._moveHandler);
                },
                onRemove: function() {
                    if (this._moveHandler) this._map.off('move zoom resize', this._moveHandler);
                    if (this._canvas && this._canvas.parentNode) {
                        this._canvas.parentNode.removeChild(this._canvas);
                    }
                },
                _reset: function() {
                    const size = this._map.getSize();
                    this._canvas.width = size.x;
                    this._canvas.height = size.y;
                    this._canvas.style.width = size.x + 'px';
                    this._canvas.style.height = size.y + 'px';
                },
                _draw: function() {
                    if (!this._ctx) return;
                    
                    const ctx = this._ctx;
                    const map = this._map;
                    const size = map.getSize();
                    
                    ctx.clearRect(0, 0, size.x, size.y);
                    
                    const radiusPx = radius || 10;
                    const blurPx = blur || 5;
                    
                    for (const p of puntos) {
                        const point = map.latLngToContainerPoint([p.lat, p.lng]);
                        const intensity = Math.max(0.15, Math.min(1, p.intensity));
                        
                        const grad = ctx.createRadialGradient(
                            point.x, point.y, 0,
                            point.x, point.y, radiusPx + blurPx
                        );
                        
                        const r = Math.min(255, Math.round(intensity * 255));
                        const g = Math.min(255, Math.round((1 - Math.abs(intensity - 0.5) * 2) * 255));
                        const b = Math.min(255, Math.round((1 - intensity) * 255));
                        
                        const alpha = 0.3 + intensity * 0.5;
                        grad.addColorStop(0, `rgba(${r}, ${g}, ${b}, ${alpha})`);
                        grad.addColorStop(0.5, `rgba(${r}, ${g}, ${b}, ${alpha * 0.6})`);
                        grad.addColorStop(1, `rgba(${r}, ${g}, ${b}, 0)`);
                        
                        ctx.beginPath();
                        ctx.arc(point.x, point.y, radiusPx + blurPx, 0, Math.PI * 2);
                        ctx.fillStyle = grad;
                        ctx.fill();
                    }
                }
            });
            
            return new HeatmapLayer();
        }

        // ================================================================
        // 12. ACTUALIZAR MAPA
        // ================================================================
        function updateMap() {
            if (!geoJsonData) return;
        
            const variable = currentVariable;
            const featuresFiltradas = aplicarFiltros(allFeatures, variable);
            currentFeaturesFiltradas = featuresFiltradas;
        
            document.getElementById('count-mostrados').textContent = featuresFiltradas.length;
            document.getElementById('count-total').textContent = allFeatures.length;
        
            if (currentLayer) {
                map.removeLayer(currentLayer);
                currentLayer = null;
            }
            if (heatmapLayer) {
                map.removeLayer(heatmapLayer);
                heatmapLayer = null;
            }
        
            if (currentMode === 'heatmap') {
                const puntos = calcularPuntosHeatmap(featuresFiltradas, variable);
                heatmapPoints = puntos;
                
                if (puntos.length === 0) {
                    document.getElementById('info-value').textContent = '⚠️ No hay datos para el heatmap';
                    document.getElementById('legend').innerHTML = `
                        <div class="legend-title">🔥 Mapa de Calor</div>
                        <div class="legend-desc">⚠️ No hay datos disponibles</div>
                    `;
                    return;
                }
        
                try {
                    const radius = parseInt(document.getElementById('radius-slider').value) || 10;
                    const blur = parseInt(document.getElementById('blur-slider').value) || 5;
                    
                    const heatData = puntos.map(p => [p.lat, p.lng, p.intensity]);
                    
                    const heatConfig = {
                        radius: radius,
                        blur: blur,
                        maxZoom: 15,
                        minOpacity: 0.18,
                        maxOpacity: 0.72,
                        gradient: {
                            0.0: 'blue',
                            0.2: 'cyan',
                            0.4: 'lime',
                            0.6: 'yellow',
                            0.8: 'orange',
                            1.0: 'red'
                        }
                    };
        
                    if (typeof L.heatLayer === 'function') {
                        heatmapLayer = L.heatLayer(heatData, heatConfig).addTo(map);
                        console.log(`🔥 Heatmap generado con L.heatLayer: ${puntos.length} puntos`);
                    } else {
                        console.warn('⚠️ L.heatLayer no disponible, usando fallback con canvas');
                        heatmapLayer = crearHeatmapFallback(puntos, map, radius, blur);
                        heatmapLayer.addTo(map);
                        console.log(`🔥 Heatmap generado con fallback: ${puntos.length} puntos`);
                    }
                    
                    // ============================================================
                    // ★ POLÍGONOS COMO LÍNEAS TENUES (SOLO EN MODO HEATMAP)
                    // ============================================================
                    currentLayer = L.geoJSON({
                        type: 'FeatureCollection',
                        features: featuresFiltradas
                    }, {
                        style: {
                            fillColor: 'transparent',        // Sin relleno
                            fillOpacity: 0,
                            color: 'rgba(255,255,255,0.35)', // Línea blanca tenue
                            weight: 1.2,
                            opacity: 0.6
                        },
                        onEachFeature: function(feature, layer) {
                            layer.bindPopup(crearPopup(feature.properties));
                        }
                    }).addTo(map);
        
                    document.getElementById('legend').innerHTML = `
                        <div class="legend-title">🔥 Mapa de Calor</div>
                        <div class="gradient-bar"></div>
                        <div class="gradient-labels">
                            <span>Bajo</span>
                            <span>Alto</span>
                        </div>
                        <div class="legend-desc">💡 ${puntos.length} puntos · ${variableLabels[variable] || variable}</div>
                    `;
        
                    document.getElementById('info-label').textContent = variableLabels[variable] || variable;
                    document.getElementById('info-value').textContent = `${puntos.length} manzanas en calor`;
                } catch (e) {
                    console.error('❌ Error al crear heatmap:', e);
                    document.getElementById('info-value').textContent = '⚠️ Error al generar el heatmap';
                    mostrarPoligonos(featuresFiltradas, variable);
                }
                return;
            }
        
            mostrarPoligonos(featuresFiltradas, variable);
        }
        
        function mostrarPoligonos(features, variable) {
            currentLayer = L.geoJSON({
                type: 'FeatureCollection',
                features: features
            }, {
                style: function(feature) {
                    let value = feature.properties[variable];
                    let color = '#cccccc';
                    if (variable === 'CAT_DENS') {
                        color = catColors[value] || '#cccccc';
                    } else {
                        const numVal = parseFloat(value);
                        if (!isNaN(numVal) && numVal !== null) {
                            color = getColorByValue(variable, numVal);
                        }
                    }
                    return { fillColor: color, weight: 1, opacity: 0.8, color: '#333333', fillOpacity: 0.8 };
                },
                onEachFeature: function(feature, layer) {
                    layer.bindPopup(crearPopup(feature.properties));
                    layer.on('mouseover', function() {
                        this.setStyle({ weight: 2.5, color: '#000000', fillOpacity: 0.95 });
                        this.bringToFront();
                    });
                    layer.on('mouseout', function() {
                        const value = this.feature.properties[variable];
                        let color = '#cccccc';
                        if (variable === 'CAT_DENS') {
                            color = catColors[value] || '#cccccc';
                        } else {
                            const numVal = parseFloat(value);
                            if (!isNaN(numVal) && numVal !== null) {
                                color = getColorByValue(variable, numVal);
                            }
                        }
                        this.setStyle({ weight: 1, color: '#333333', fillColor: color, fillOpacity: 0.8 });
                    });
                }
            }).addTo(map);
        
            updateLegend(variable, features);
            document.getElementById('info-label').textContent = variableLabels[variable] || variable;
            document.getElementById('info-value').textContent = 'Clic en una manzana para detalles';
        }

        // ================================================================
        // 13. LEYENDA
        // ================================================================
        function updateLegend(variable, features) {
            const legendDiv = document.getElementById('legend');
            let html = `<div class="legend-title">Leyenda</div>`;

            if (variable === 'CAT_DENS') {
                const categories = ['MUY_BAJA', 'BAJA', 'MEDIA', 'ALTA', 'MUY_ALTA', 'SIN_DATOS'];
                for (const cat of categories) {
                    html += `<div class="legend-item">
                        <div class="legend-color" style="background:${catColors[cat]};"></div>
                        <span class="legend-text">${catLabels[cat]}</span>
                    </div>`;
                }
            } else {
                const nombresRangos = obtenerNombresRangos(variable);
                const colores = getColoresRangos(variable);
                for (let i = 0; i < nombresRangos.length; i++) {
                    html += `<div class="legend-item">
                        <div class="legend-color" style="background:${colores[i]};"></div>
                        <span class="legend-text">${nombresRangos[i]}</span>
                    </div>`;
                }
            }

            const desc = descripcionIndicador[variable] || '';
            if (desc) html += `<div class="legend-desc">💡 ${desc}</div>`;
            legendDiv.innerHTML = html;
        }

        // ================================================================
        // 14. ACTUALIZAR HEATMAP (sliders)
        // ================================================================
        function actualizarHeatmapParams() {
            if (!heatmapPoints || heatmapPoints.length === 0) {
                updateMap();
                return;
            }
            
            const radius = parseInt(document.getElementById('radius-slider').value) || 10;
            const blur = parseInt(document.getElementById('blur-slider').value) || 5;
            
            try {
                if (heatmapLayer) {
                    map.removeLayer(heatmapLayer);
                    heatmapLayer = null;
                }
                
                const heatData = heatmapPoints.map(p => [p.lat, p.lng, p.intensity]);
                
                const heatConfig = {
                    radius: radius,
                    blur: blur,
                    maxZoom: 15,
                    minOpacity: 0.18,
                    maxOpacity: 0.72,
                    gradient: {
                        0.0: 'blue',
                        0.2: 'cyan',
                        0.4: 'lime',
                        0.6: 'yellow',
                        0.8: 'orange',
                        1.0: 'red'
                    }
                };
        
                if (typeof L.heatLayer === 'function') {
                    heatmapLayer = L.heatLayer(heatData, heatConfig).addTo(map);
                    console.log(`✅ Heatmap actualizado: radius=${radius}px, blur=${blur}px`);
                } else {
                    heatmapLayer = crearHeatmapFallback(heatmapPoints, map, radius, blur);
                    heatmapLayer.addTo(map);
                    console.log(`✅ Heatmap fallback actualizado: radius=${radius}px, blur=${blur}px`);
                }
            } catch (e) {
                console.warn('⚠️ Error al actualizar heatmap:', e);
            }
        }

        // ================================================================
        // 15. VERIFICAR LIBRERÍAS
        // ================================================================
        function verificarLibrerias() {
            console.log('=== VERIFICACIÓN DE LIBRERÍAS ===');
            console.log('L.heatLayer disponible:', typeof L.heatLayer);
            console.log('turf disponible:', typeof turf);
            console.log('Chart disponible:', typeof Chart);
            
            if (typeof L.heatLayer === 'function') {
                console.log('✅ Todas las librerías cargadas correctamente');
            } else {
                console.log('⚠️ L.heatLayer NO está disponible, se usará fallback con canvas');
            }
        }

        // ================================================================
        // 16. CARGA DEL GEOJSON
        // ================================================================
        async function loadGeoJSON() {
            try {
                const response = await fetch('manzanas.geojson');
                if (!response.ok) throw new Error('HTTP ' + response.status);
                const data = await response.json();
                geoJsonData = data;
                allFeatures = data.features;
                console.log('✅ GeoJSON cargado:', allFeatures.length, 'features');

                const categories = ['MUY_BAJA', 'BAJA', 'MEDIA', 'ALTA', 'MUY_ALTA', 'SIN_DATOS'];
                for (const cat of categories) filtrosActivos[cat] = true;
                for (let i = 0; i < 5; i++) filtrosActivos[`rango_${i}`] = true;

                const variable = document.getElementById('variable-select').value;
                currentVariable = variable;
                construirFiltros(variable);
                updateMap();

                const bounds = L.geoJSON(data).getBounds();
                if (bounds.isValid()) map.fitBounds(bounds, { padding: [20, 20] });
            } catch (error) {
                console.error('❌ Error:', error);
                document.getElementById('info-box').innerHTML = `
                    <div style="color:#b94a4a;font-weight:bold;">⚠️ Error al cargar los datos</div>
                    <div style="font-size:10px;margin-top:2px;">${error.message}</div>
                    <div style="font-size:10px;margin-top:2px;">Asegúrate de que <strong>manzanas.geojson</strong> esté en la misma carpeta.</div>
                `;
            }
        }

        // ================================================================
        // 17. EVENTOS
        // ================================================================
        document.getElementById('variable-select').addEventListener('change', function(e) {
            currentVariable = e.target.value;
            document.getElementById('searchInput').value = '';
            construirFiltros(currentVariable);
            updateMap();
        });

        document.getElementById('map-select').addEventListener('change', function(e) {
            const value = e.target.value;
            map.removeLayer(satelliteLayer);
            map.removeLayer(osmLayer);
            map.removeLayer(topoLayer);
            if (value === 'satellite') satelliteLayer.addTo(map);
            else if (value === 'osm') osmLayer.addTo(map);
            else if (value === 'topo') topoLayer.addTo(map);
        });

        document.getElementById('btn-polygon').addEventListener('click', function() {
            currentMode = 'polygon';
            this.classList.add('active');
            document.getElementById('btn-heatmap').classList.remove('active');
            document.getElementById('heatmap-controls').style.display = 'none';
            updateMap();
        });

        document.getElementById('btn-heatmap').addEventListener('click', function() {
            currentMode = 'heatmap';
            this.classList.add('active');
            document.getElementById('btn-polygon').classList.remove('active');
            document.getElementById('heatmap-controls').style.display = 'block';
            updateMap();
        });

        document.getElementById('searchInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') buscarManzana();
        });

        document.getElementById('statsModal').addEventListener('click', function(e) {
            if (e.target === this) closeStats();
        });

        const radiusSlider = document.getElementById('radius-slider');
        const blurSlider = document.getElementById('blur-slider');
        const radiusVal = document.getElementById('radius-val');
        const blurVal = document.getElementById('blur-val');
        let heatmapTimeout = null;

        radiusSlider.addEventListener('input', function(e) {
            radiusVal.innerText = e.target.value;
            clearTimeout(heatmapTimeout);
            heatmapTimeout = setTimeout(() => {
                actualizarHeatmapParams();
            }, 200);
        });

        blurSlider.addEventListener('input', function(e) {
            blurVal.innerText = e.target.value;
            clearTimeout(heatmapTimeout);
            heatmapTimeout = setTimeout(() => {
                actualizarHeatmapParams();
            }, 200);
        });


        // ================================================================
        // ★ CORRECCIÓN: FORZAR ACTUALIZACIÓN DEL HEATMAP AL MOVER/ZOOM
        // ================================================================
        map.on('moveend zoomend', function() {
            if (currentMode === 'heatmap' && heatmapLayer) {
                // Si es el fallback de canvas, forzar redibujo
                if (typeof heatmapLayer._draw === 'function') {
                    heatmapLayer._reset();
                    heatmapLayer._draw();
                }
                // Si es L.heatLayer, recrearlo para que se ajuste
                else if (typeof L.heatLayer === 'function' && heatmapPoints && heatmapPoints.length > 0) {
                    const radius = parseInt(document.getElementById('radius-slider').value) || 10;
                    const blur = parseInt(document.getElementById('blur-slider').value) || 5;
                    const heatData = heatmapPoints.map(p => [p.lat, p.lng, p.intensity]);
                    
                    try {
                        map.removeLayer(heatmapLayer);
                        heatmapLayer = L.heatLayer(heatData, {
                            radius: radius,
                            blur: blur,
                            maxZoom: 15,
                            minOpacity: 0.18,
                            maxOpacity: 0.72,
                            gradient: {
                                0.0: 'blue',
                                0.2: 'cyan',
                                0.4: 'lime',
                                0.6: 'yellow',
                                0.8: 'orange',
                                1.0: 'red'
                            }
                        }).addTo(map);
                    } catch (e) {
                        console.warn('⚠️ Error al recrear heatmap en zoom:', e);
                    }
                }
            }
        });
        
        // Exponer funciones globales
        window.toggleAllFiltros = toggleAllFiltros;
        window.resetFiltros = resetFiltros;
        window.buscarManzana = buscarManzana;
        window.exportarCSV = exportarCSV;
        window.mostrarEstadisticas = mostrarEstadisticas;
        window.closeStats = closeStats;

        
        // ================================================================
        // 18. INICIO
        // ================================================================
        console.log('🗺️ Mapa de Manzanas iniciado – RAUL VIQUEZ');
        console.log('📌 Usando leaflet-heatmap con fallback canvas');
        
        verificarLibrerias();
        loadGeoJSON();
    </script>

</body>
</html>
